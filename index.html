<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Biblioteca - Autenticação</title>
</head>
<body style="margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: sans-serif;">

  <!-- Botão para alternar a tela -->
  <button id="btn-registrar" type="button" style="position: absolute; top: 20px; right: 20px;">
    Registrar
  </button>

  <!-- Container de Formulário Centralizado -->
  <div>
    <h2 id="titulo-form">Acesso ao Sistema</h2>

    <form id="form-login" novalidate>
      <!-- Container para campos adicionais de cadastro (Nome e Confirmar Senha) -->
      <div id="campos-cadastro" style="display: none;">
        <div>
          <label for="nome">Nome Completo:</label><br>
          <input type="text" id="nome">
        </div>
        <br>
      </div>

      <div>
        <label for="email">E-mail:</label><br>
        <input type="email" id="email" required>
      </div>
      <br>

      <div>
        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" required>
      </div>
      <br>

      <div id="campo-confirmar-senha" style="display: none;">
        <div>
          <label for="confirmar-senha">Confirmar Senha:</label><br>
          <input type="password" id="confirmar-senha">
        </div>
        <br>
      </div>

      <button id="btn-submeter" type="submit">Entrar</button>
    </form>

    <p id="mensagem"></p>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
